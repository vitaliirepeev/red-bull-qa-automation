[pytest]
addopts = -ra --strict-markers
testpaths = tests
markers =
    api: HTTP API coverage
    ui: browser-based frontend smoke coverage
    contract: behavior that depends on an agreed API contract
    known_defect: regression that currently fails against the QA build
    database: read-only database integration checks
    state_changing: tests that may dispatch a command and require explicit approval
    serial: ordered state-changing tests that must not run concurrently
